name: Deploy to VPS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 108.174.148.133
          port: 22022
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: bash /opt/deploy-enviadados.sh
