<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Obsidian — Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'surface': '#111110',
          'surface-container': '#1c1b1b',
          'surface-container-low': '#181817',
          'on-surface': '#e6e3de',
        }
      }
    }
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex items-center justify-center">

<div class="w-full max-w-sm px-6">
  <!-- Logo -->
  <div class="text-center mb-10">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#FF6600]/10 border border-[#FF6600]/20 mb-4">
      <span class="material-symbols-outlined text-[#FF6600] text-3xl" style="font-variation-settings:'FILL' 1;">diamond</span>
    </div>
    <h1 class="text-[#FF6600] font-black text-2xl tracking-tight">Obsidian</h1>
    <p class="text-gray-500 text-xs tracking-widest mt-1">Analytical Suite</p>
  </div>

  <!-- Card -->
  <div class="bg-surface-container border border-white/5 rounded-2xl p-8 shadow-2xl shadow-black/40">
    <h2 class="text-white font-bold text-lg mb-1">Entrar</h2>
    <p class="text-gray-500 text-xs mb-6">Acesse com suas credenciais</p>

    <form id="form_login" onsubmit="fazerLogin(event)" novalidate>
      <div class="mb-4">
        <label class="block text-[10px] font-semibold text-gray-500 uppercase tracking-widest mb-1.5">E-mail</label>
        <input id="inp_email" type="email" autocomplete="email" placeholder="seu@email.com"
          class="w-full bg-surface border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-600
                 focus:outline-none focus:border-[#FF6600]/50 transition-colors"/>
      </div>
      <div class="mb-6">
        <label class="block text-[10px] font-semibold text-gray-500 uppercase tracking-widest mb-1.5">Senha</label>
        <div class="relative">
          <input id="inp_senha" type="password" autocomplete="current-password" placeholder="••••••••"
            class="w-full bg-surface border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white placeholder-gray-600
                   focus:outline-none focus:border-[#FF6600]/50 transition-colors pr-10"/>
          <button type="button" onclick="toggleSenha()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-400 transition-colors">
            <span id="eye_icon" class="material-symbols-outlined text-base">visibility</span>
          </button>
        </div>
      </div>

      <p id="erro_login" class="text-red-400 text-xs mb-4 hidden">E-mail ou senha incorretos.</p>

      <button type="submit" id="btn_entrar"
        class="w-full bg-[#FF6600] hover:bg-[#e55a00] active:bg-[#cc5000] text-white font-bold rounded-lg py-2.5 text-sm transition-colors flex items-center justify-center gap-2">
        <span id="btn_icon" class="material-symbols-outlined text-base" style="font-variation-settings:'FILL' 1;">login</span>
        <span id="btn_txt">Entrar</span>
      </button>
    </form>
  </div>

  <p class="text-center text-gray-700 text-[10px] mt-6">Obsidian © 2026</p>
</div>

<script>
const USUARIOS = {
  'gesseinvest@gmail.com':  '33fa1b511447a982a4e7827bc6ab6a8d41173da2c039b394836e9385c501a93d',
  'tfmachado@yahoo.com.br': '33fa1b511447a982a4e7827bc6ab6a8d41173da2c039b394836e9385c501a93d',
};

// Redireciona se já logado
if (localStorage.getItem('obs_session')) {
  window.location.href = 'calendario_vendas.html';
}

function sha256(str) {
  // Pure-JS SHA-256 — funciona sem HTTPS
  const bytes = new TextEncoder().encode(str);
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const r=(v,n)=>(v>>>n)|(v<<(32-n));
  const pad=[...bytes,0x80];
  while(pad.length%64!==56)pad.push(0);
  const bits=bytes.length*8;
  pad.push(0,0,0,0,(bits>>>24)&0xff,(bits>>>16)&0xff,(bits>>>8)&0xff,bits&0xff);
  for(let off=0;off<pad.length;off+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++)w[i]=(pad[off+i*4]<<24)|(pad[off+i*4+1]<<16)|(pad[off+i*4+2]<<8)|pad[off+i*4+3];
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3);const s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let [a,b,c,d,e,f,g,hv]=h;
    for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25);const ch=(e&f)^(~e&g);const t1=(hv+S1+ch+K[i]+w[i])|0;const S0=r(a,2)^r(a,13)^r(a,22);const mj=(a&b)^(a&c)^(b&c);const t2=(S0+mj)|0;hv=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
    h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hv)|0;
  }
  return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

function fazerLogin(e) {
  e.preventDefault();
  const email = document.getElementById('inp_email').value.trim().toLowerCase();
  const senha = document.getElementById('inp_senha').value;
  const erro  = document.getElementById('erro_login');
  const btn   = document.getElementById('btn_entrar');
  const icon  = document.getElementById('btn_icon');
  const txt   = document.getElementById('btn_txt');

  erro.classList.add('hidden');
  btn.disabled = true;
  icon.textContent = 'sync';
  icon.classList.add('animate-spin');
  txt.textContent = 'Verificando...';

  const hash = sha256(senha);

  if (USUARIOS[email] && USUARIOS[email] === hash) {
    localStorage.setItem('obs_session', JSON.stringify({ email, ts: Date.now() }));
    window.location.href = 'calendario_vendas.html';
  } else {
    erro.classList.remove('hidden');
    btn.disabled = false;
    icon.textContent = 'login';
    icon.classList.remove('animate-spin');
    txt.textContent = 'Entrar';
  }
}

function toggleSenha() {
  const inp  = document.getElementById('inp_senha');
  const icon = document.getElementById('eye_icon');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.textContent = 'visibility_off';
  } else {
    inp.type = 'password';
    icon.textContent = 'visibility';
  }
}
</script>
</body>
</html>
