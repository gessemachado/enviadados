<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Obsidian — Projeção</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#131312"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="stylesheet" href="obsidian.css"/>
<style>
.pills-section { padding: .625rem .875rem; }
.pills-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .5rem; }
.pills-links { display: flex; gap: .875rem; font-size: .7rem; }
.pills-links button { background: none; border: none; color: var(--accent); cursor: pointer; font-size: .7rem; }
.pills-wrap { display: flex; flex-wrap: wrap; gap: .375rem; }
.difmax { display: flex; align-items: center; gap: .75rem; padding: .5rem .875rem .875rem; }
.difmax label { font-size: .7rem; color: var(--text-off); text-transform: uppercase; letter-spacing: .06em; }
</style>
</head>
<body class="page">

<header class="topbar">
  <button class="icon-btn" onclick="logout()"><span class="material-symbols-outlined" style="font-size:22px">logout</span></button>
  <span class="topbar__title">Projeção de Compras</span>
  <span style="font-size:.6rem;color:var(--text-off)" id="periodo_label"></span>
</header>

<div id="loja_sel_wrap" style="display:none;padding:.5rem .875rem .25rem">
  <select id="sel_loja" onchange="filtrarLoja(this.value)" class="inp inp--sm" style="width:100%">
    <option value="">— Todas as lojas —</option>
  </select>
</div>

<!-- Grupos -->
<div class="pills-section">
  <div class="pills-head">
    <span class="label">Grupos</span>
    <div class="pills-links">
      <button onclick="selecionarTodos(true)">Todos</button>
      <span style="color:var(--s-top)">|</span>
      <button onclick="selecionarTodos(false)">Nenhum</button>
    </div>
  </div>
  <div class="pills-wrap" id="grupos_wrap">
    <span style="color:var(--text-off);font-size:.7rem">Carregando...</span>
  </div>
</div>

<!-- Diferença Máxima -->
<div class="difmax">
  <label>Diferença Máxima</label>
  <input id="difmax" type="number" class="inp inp--sm" value="5" style="width:64px"/>
</div>

<!-- Botão Consultar -->
<div style="padding:0 .875rem .875rem">
  <button id="btn_consultar" class="btn btn--primary" onclick="consultar()">
    <span class="material-symbols-outlined" style="font-size:18px">search</span>
    Consultar
  </button>
</div>

<!-- Resultado -->
<div id="resultado" style="display:none">
  <div class="section-head" style="display:flex;align-items:center;justify-content:space-between;padding-right:.875rem">
    <span class="section-title" id="res_titulo">Resultado</span>
    <button onclick="gerarPedidoPDF()" style="display:flex;align-items:center;gap:6px;background:#FF6600;color:white;border:none;border-radius:8px;padding:6px 14px;font-size:.7rem;font-weight:700;cursor:pointer">
      <span class="material-symbols-outlined" style="font-size:16px">picture_as_pdf</span> PDF
    </button>
  </div>
  <div class="scroll-x" style="padding:0 .875rem 1.5rem">
    <table class="tbl">
      <thead><tr><th>Código</th><th>Produto</th><th>Estoque</th><th>Méd/Mês</th><th>Diferença</th><th>PB</th><th>Kg Total</th></tr></thead>
      <tbody id="tbody_res"></tbody>
    </table>
    <div class="pag" id="pag_res"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="home.html" class="nav-item"><span class="material-symbols-outlined">calendar_month</span><span>Diário</span></a>
  <a href="produtos.html" class="nav-item"><span class="material-symbols-outlined">bar_chart</span><span>Produtos</span></a>
  <a href="financeiro.html" class="nav-item"><span class="material-symbols-outlined">payments</span><span>Financeiro</span></a>
  <a id="link_clientes" href="clientes.html" class="nav-item" style="display:none"><span class="material-symbols-outlined">group</span><span>Clientes</span></a>
  <a href="projecao.html" class="nav-item nav-item--active"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">warehouse</span><span>Projeção</span></a>
  <a href="perfil.html" class="nav-item"><span class="material-symbols-outlined">manage_accounts</span><span>Perfil</span></a>
</nav>

<script>
if (!localStorage.getItem('obs_token')) location.href = 'login.html';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
try{const _u=JSON.parse(localStorage.getItem('obs_user')||'{}');if(_u.admin||(_u.nome||'').toLowerCase().includes('gess')){const _lc=document.getElementById('link_clientes');if(_lc)_lc.style.display='flex';}}catch(e){}

let dadosRes = [], pRes = 1;
const PPP = 15;

function logout() { localStorage.removeItem('obs_token'); localStorage.removeItem('obs_user'); location.href = 'login.html'; }

function filtrarLoja(v) {
  if (v) sessionStorage.setItem('obs_tenant_filter', v);
  else sessionStorage.removeItem('obs_tenant_filter');
  location.reload();
}
async function initLojaSelector() {
  const u = JSON.parse(localStorage.getItem('obs_user') || '{}');
  if (!u.admin) return;
  const wrap = document.getElementById('loja_sel_wrap');
  wrap.style.display = 'block';
  try {
    const lojas = await apiFetch('/api/lojas');
    const sel = document.getElementById('sel_loja');
    lojas.forEach(l => { const o = new Option(l.nome, l.id_tenant||''); sel.appendChild(o); });
    const saved = sessionStorage.getItem('obs_tenant_filter');
    if (saved) sel.value = saved;
  } catch(e) {}
}
async function apiFetch(url, opts = {}) {
  const token = localStorage.getItem('obs_token');
  const tenant = sessionStorage.getItem('obs_tenant_filter');
  if (tenant) url += (url.includes('?') ? '&' : '?') + 'tenant_filter=' + tenant;
  const r = await fetch(url, { ...opts, headers: { ...(opts.headers||{}), 'Authorization': `Bearer ${token}` } });
  if (r.status === 401) { logout(); throw new Error('Sessão expirada'); }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

const hoje = new Date();
const hojeStr = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(hoje.getDate()).padStart(2,'0')}`;
const anoAtr = hoje.getFullYear() - 1;
const iniPeriodo = `${anoAtr}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(hoje.getDate()).padStart(2,'0')}`;
document.getElementById('periodo_label').textContent = `${iniPeriodo.split('-').reverse().join('/')} – ${hojeStr.split('-').reverse().join('/')}`;

async function carregarGrupos() {
  const data = await apiFetch('/api/grupos');
  const wrap = document.getElementById('grupos_wrap');
  wrap.innerHTML = '';
  (data||[]).forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'pill pill--off';
    btn.dataset.id = g.grupo;
    btn.dataset.sel = 'false';
    btn.textContent = `${g.id_grupo} — ${g.grupo}`;
    btn.onclick = () => togglePill(btn);
    wrap.appendChild(btn);
  });
}

function togglePill(btn) {
  const on = btn.dataset.sel === 'true';
  btn.dataset.sel = on ? 'false' : 'true';
  btn.className = on ? 'pill pill--off' : 'pill pill--on';
}

function selecionarTodos(v) {
  document.querySelectorAll('.pills-wrap .pill').forEach(b => {
    b.dataset.sel = v ? 'true' : 'false';
    b.className = v ? 'pill pill--on' : 'pill pill--off';
  });
}

async function consultar() {
  const grupos = [...document.querySelectorAll('.pills-wrap .pill[data-sel="true"]')].map(b=>b.dataset.id);
  if (!grupos.length) { alert('Selecione pelo menos um grupo.'); return; }
  const difMax = parseFloat(document.getElementById('difmax').value) || 5;

  const btn = document.getElementById('btn_consultar');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined spin" style="font-size:18px">sync</span> Consultando...';

  try {
    const res = await apiFetch('/api/relatorio_estoque', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        data_inicio:   iniPeriodo,
        data_fim:      hojeStr,
        grupos:        grupos,
        id_loja:       1,
        diferenca_max: difMax,
      }),
    });

    dadosRes = (res || []).sort((a, b) => parseFloat(a.diferenca ?? 0) - parseFloat(b.diferenca ?? 0));
    pRes = 1;
    renderRes();
    document.getElementById('resultado').style.display = 'block';
    document.getElementById('resultado').scrollIntoView({ behavior: 'smooth' });
  } catch(e) {
    alert('Erro ao consultar: ' + (e.message||e));
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px">search</span> Consultar';
  }
}

function renderRes() {
  const total = dadosRes.length;
  document.getElementById('res_titulo').textContent = `${total} produto${total!==1?'s':''} encontrado${total!==1?'s':''}`;
  const ini = (pRes-1)*PPP, fim = Math.min(ini+PPP, total);
  const pg = dadosRes.slice(ini, fim);

  const fmt = (v, d=2) => v != null ? parseFloat(v).toFixed(d) : '—';
  document.getElementById('tbody_res').innerHTML = pg.map(r => {
    const diff = parseFloat(r.diferenca ?? 0);
    const diffCls = diff < 0 ? 'style="color:#f87171;font-weight:700"' : diff <= 2 ? 'style="color:#fb923c;font-weight:600"' : 'class="accent"';
    return `<tr>
      <td class="dim" style="font-size:.6rem;white-space:nowrap;font-family:monospace">${r.codigo || '—'}</td>
      <td style="max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.descricao||r.codigo||'—'}</td>
      <td class="dim">${fmt(r.estoque_atual,1)}</td>
      <td class="dim">${fmt(r.med_mensal,1)}</td>
      <td ${diffCls}>${fmt(r.diferenca,1)}</td>
      <td class="dim">${r.pb > 0 ? fmt(r.pb,3) : '—'}</td>
      <td style="${r.peso_total > 0 ? 'color:#fdba74;font-weight:600' : 'color:var(--text-off)'}">${r.peso_total > 0 ? fmt(r.peso_total,1) : '—'}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--text-off);padding:1rem">Sem resultados</td></tr>';

  const pages = Math.ceil(total/PPP);
  const pag = document.getElementById('pag_res');
  if (pages <= 1) { pag.innerHTML=''; return; }
  pag.innerHTML = `
    <button class="pag-btn" ${pRes<=1?'disabled':''} onclick="pRes--;renderRes()">‹</button>
    <span class="pag-info">${pRes} / ${pages}</span>
    <button class="pag-btn" ${pRes>=pages?'disabled':''} onclick="pRes++;renderRes()">›</button>`;
}

function gerarPedidoPDF() {
  if (!dadosRes.length && !dadosRes.length) { alert('Consulte os dados primeiro.'); return; }
  const todos = dadosRes;
  if (!todos.length) { alert('Consulte os dados primeiro.'); return; }

  const soNegativos = confirm('Imprimir apenas itens com diferença negativa?\n\nOK = Somente negativos\nCancelar = Todos os itens');
  const itens = soNegativos ? todos.filter(r => parseFloat(r.diferenca) < 0) : todos;
  if (!itens.length) { alert('Nenhum item com diferença negativa encontrado.'); return; }

  const hoje = new Date().toLocaleDateString('pt-BR');
  const fmt = (v, d=2) => v != null && v !== '' ? parseFloat(v).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d}) : '—';
  const fmtD = d => d ? d.split('-').reverse().join('/') : '';
  const pesoGeral = itens.reduce((s, r) => s + (parseFloat(r.peso_total) || 0), 0);

  const grupos = {};
  itens.forEach(r => {
    if (!grupos[r.id_grupo]) grupos[r.id_grupo] = { id: r.id_grupo, nome: r.grupo, itens: [] };
    grupos[r.id_grupo].itens.push(r);
  });

  const gruposHtml = Object.values(grupos).map(g => `
    <div style="margin-bottom:24px">
      <div style="display:inline-block;background:#FF6600;color:white;padding:3px 14px;border-radius:999px;font-size:11px;font-weight:700;margin-bottom:10px">${g.id} — ${g.nome}</div>
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead><tr style="border-bottom:2px solid #e5e7eb">
          ${['CÓDIGO','DESCRIÇÃO','EST. ATUAL','DIFERENÇA','PB (KG)','PESO TOTAL'].map((h,i)=>
            `<th style="padding:5px 6px;color:#6b7280;font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;text-align:${i<=1?'left':'right'}">${h}</th>`
          ).join('')}
        </tr></thead>
        <tbody>${g.itens.map((r,i) => {
          const diff = parseFloat(r.diferenca);
          const dc = diff < 0 ? '#dc2626' : diff <= 2 ? '#ea580c' : '#374151';
          return `<tr style="border-bottom:1px solid #f3f4f6;background:${i%2?'#f9fafb':'white'}">
            <td style="padding:7px 6px;font-family:monospace;color:#9ca3af;font-size:10px">${r.codigo||''}</td>
            <td style="padding:7px 6px;font-weight:700;color:#111827">${r.descricao||''}</td>
            <td style="padding:7px 6px;text-align:right;color:#374151">${fmt(r.estoque_atual,0)}</td>
            <td style="padding:7px 6px;text-align:right;color:${dc};font-weight:${diff<0?700:400}">${fmt(r.diferenca,2)}</td>
            <td style="padding:7px 6px;text-align:right;color:#6b7280">${r.pb > 0 ? fmt(r.pb,3) : '—'}</td>
            <td style="padding:7px 6px;text-align:right;font-weight:700;color:#111827">${r.peso_total > 0 ? fmt(r.peso_total,2) : '—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`).join('');

  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Pedido de Compra</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'Inter',sans-serif;color:#111827;background:white;padding:32px}
      @media print{body{padding:20px} @page{margin:1cm}}
    </style></head><body>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px">
      <div>
        <h1 style="font-family:'Manrope',sans-serif;font-size:24px;font-weight:900;margin-bottom:3px">Pedido de Compra</h1>
        <p style="font-size:12px;color:#9ca3af">Projeção de Compras · Análise dos últimos 12 meses</p>
      </div>
    </div>
    <div style="border:1px solid #e5e7eb;border-radius:10px;padding:16px 24px;display:flex;flex-wrap:wrap;gap:32px;margin-bottom:28px">
      <div><div style="font-size:9px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">Período</div>
        <div style="font-size:13px;font-weight:700">${fmtD(iniPeriodo)} até ${fmtD(hojeStr)}</div></div>
      <div><div style="font-size:9px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">Data do Pedido</div>
        <div style="font-size:13px;font-weight:700">${hoje}</div></div>
      <div><div style="font-size:9px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">Total de Itens</div>
        <div style="font-size:13px;font-weight:700">${itens.length} produto${itens.length!==1?'s':''}</div></div>
    </div>
    ${gruposHtml}
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:24px;padding-top:16px;border-top:1px solid #e5e7eb">
      <p style="font-size:10px;color:#9ca3af;max-width:300px;line-height:1.6">* Itens com diferença negativa indicam necessidade de reposição de estoque. Sujeito a confirmação do fornecedor.</p>
      <div style="text-align:right">
        <div style="font-size:9px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">Peso Total Geral</div>
        <div style="font-size:28px;font-weight:900;font-family:'Manrope',sans-serif">${fmt(pesoGeral,2)} kg</div>
      </div>
    </div>
    <script>window.onload=()=>{window.print();}<\/script>
  </body></html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `pedido_compra_${hojeStr}.html`;
  a.click();
  URL.revokeObjectURL(url);
}

carregarGrupos();
initLojaSelector();
</script>
</body>
</html>
